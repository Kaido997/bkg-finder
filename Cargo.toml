[package]
name = "bkg-finder"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[[bin]]
name = "bkg-finder"
path = "src/main.rs"

[[bin]]
name = "bench_rust"
path = "src/bin/bench_rust.rs"

[lib]
name = "bkg_finder"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

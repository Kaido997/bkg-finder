<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#245c42" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BKG Finder" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>BKG Finder</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="search-panel" aria-labelledby="app-title">
        <div>
          <p class="eyebrow">Mitutoyo block gauge combinations</p>
          <h1 id="app-title">BKG Finder</h1>
        </div>

        <form id="search-form" class="controls">
          <label>
            Measurement
            <input
              id="measurement"
              name="measurement"
              type="number"
              inputmode="decimal"
              min="0.0001"
              step="0.0001"
              value="4.0000"
              required
            />
          </label>

          <label>
            Results
            <input
              id="max-combinations"
              name="max-combinations"
              type="number"
              min="1"
              max="20"
              step="1"
              value="5"
              required
            />
          </label>

          <label class="wide">
            Excluded blocks
            <input
              id="exclusions"
              name="exclusions"
              type="text"
              placeholder="0.1001, 0.1020"
            />
          </label>

          <button type="submit">Find Blocks</button>
          <button id="install-button" class="secondary" type="button" hidden>
            Install App
          </button>
        </form>
      </section>

      <section class="results" aria-live="polite">
        <div class="results-header">
          <h2>Results</h2>
          <output id="status">Ready</output>
        </div>
        <div id="results-list" class="results-list"></div>
      </section>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
